services:
  backend:
    image: harshvsharma28/drivego-backend:latest
    container_name: drivego-backend
    restart: always
    expose:
      - "5000"
    env_file:
      - ./backend/.env

  frontend:
    image: harshvsharma28/drivego-frontend:latest
    container_name: drivego-frontend
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: drivego-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend