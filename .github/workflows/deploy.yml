name: Deploy to AWS EC2

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/drivego-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/drivego-backend:latest

      - name: Build and push frontend image
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=http://drivego-app.duckdns.org \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/drivego-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/drivego-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Car-rental-application
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/drivego-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/drivego-frontend:latest
            docker compose down
            docker compose up -d